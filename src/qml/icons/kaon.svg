<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Only gradients and plain shapes, no filters, masks or <use>, so Qt's SVG renderer draws it the same as a browser. -->
  <defs>
    <linearGradient id="shell" x1="0" y1="67" x2="0" y2="196" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5f6470"/><stop offset=".55" stop-color="#40444d"/><stop offset="1" stop-color="#2b2e35"/></linearGradient>
    <radialGradient id="sheen" cx="64" cy="70" r="130" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#c8ffe2" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="bevel" x1="0" y1="68.5" x2="0" y2="194.5" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity=".32"/><stop offset=".3" stop-color="#fff" stop-opacity="0"/><stop offset=".65" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".4"/></linearGradient>
    <linearGradient id="visor" x1="0" y1="80" x2="0" y2="182" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#15171c"/><stop offset=".6" stop-color="#050608"/></linearGradient>
    <!-- The shell's top lip casts a shadow into the visor -->
    <linearGradient id="lip" x1="0" y1="80" x2="0" y2="95" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#000" stop-opacity=".7"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
    <linearGradient id="visor-sheen" x1="28" y1="80" x2="130" y2="182" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#b8ffd8" stop-opacity=".13"/><stop offset=".55" stop-color="#b8ffd8" stop-opacity="0"/></linearGradient>
    <!-- Light catches the shell's lower lip around the visor -->
    <linearGradient id="rim" x1="0" y1="80" x2="0" y2="182" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#000" stop-opacity=".6"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".22"/></linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a626f"/><stop offset=".45" stop-color="#23272e"/><stop offset="1" stop-color="#0c0d10"/></linearGradient>
    <radialGradient id="glass" cx=".4" cy=".34" r=".72"><stop offset="0" stop-color="#232c3e"/><stop offset=".5" stop-color="#0a0c12"/><stop offset="1" stop-color="#050608"/></radialGradient>
    <!-- The lenses keep a little of the old icon's purple at the bottom. -->
    <linearGradient id="tint" x1="0" y1="0" x2="0" y2="1"><stop offset=".45" stop-color="#23002d" stop-opacity="0"/><stop offset="1" stop-color="#23002d" stop-opacity=".85"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#32d77f" stop-opacity=".72"/><stop offset=".6" stop-color="#22d8e6" stop-opacity=".2"/><stop offset="1" stop-color="#22d8e6" stop-opacity="0"/></radialGradient>
    <linearGradient id="orbit" x1="153" y1="108" x2="199" y2="148" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8affb8"/><stop offset="1" stop-color="#5cf2ff"/></linearGradient>
    <radialGradient id="nucleus" cx=".38" cy=".36" r=".7"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#8affb8"/><stop offset="1" stop-color="#22c46c"/></radialGradient>
    <radialGradient id="led" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#32d77f" stop-opacity=".7"/><stop offset="1" stop-color="#32d77f" stop-opacity="0"/></radialGradient>
  </defs>

  <g transform="translate(0 -4)">
  <!-- Shell -->
  <path d="M56 67 H200 A40 40 0 0 1 240 107 V156 A40 40 0 0 1 200 196 H180 C149.8 196 160.2 166 128 166 C95.8 166 106.2 196 76 196 H56 A40 40 0 0 1 16 156 V107 A40 40 0 0 1 56 67 Z" fill="url(#shell)"/>
  <path d="M56 67 H200 A40 40 0 0 1 240 107 V156 A40 40 0 0 1 200 196 H180 C149.8 196 160.2 166 128 166 C95.8 166 106.2 196 76 196 H56 A40 40 0 0 1 16 156 V107 A40 40 0 0 1 56 67 Z" fill="url(#sheen)"/>
  <path d="M56 68.5 H200 A38.5 38.5 0 0 1 238.5 107 V156 A38.5 38.5 0 0 1 200 194.5 H181 C150.3 194.5 160.9 164.5 128 164.5 C95.1 164.5 105.7 194.5 75 194.5 H56 A38.5 38.5 0 0 1 17.5 156 V107 A38.5 38.5 0 0 1 56 68.5 Z" fill="none" stroke="url(#bevel)" stroke-width="2.5"/>

  <!-- Visor, set into the shell with the same nose notch -->
  <path d="M56 80 H200 A28 28 0 0 1 228 108 V154 A28 28 0 0 1 200 182 H168 C144.8 182 152.8 156 128 156 C103.2 156 111.2 182 88 182 H56 A28 28 0 0 1 28 154 V108 A28 28 0 0 1 56 80 Z" fill="url(#visor)"/>
  <path d="M56 80 H200 A28 28 0 0 1 228 108 V154 A28 28 0 0 1 200 182 H168 C144.8 182 152.8 156 128 156 C103.2 156 111.2 182 88 182 H56 A28 28 0 0 1 28 154 V108 A28 28 0 0 1 56 80 Z" fill="url(#visor-sheen)"/>
  <path d="M56 80 H200 A28 28 0 0 1 228 108 V154 A28 28 0 0 1 200 182 H168 C144.8 182 152.8 156 128 156 C103.2 156 111.2 182 88 182 H56 A28 28 0 0 1 28 154 V108 A28 28 0 0 1 56 80 Z" fill="url(#lip)"/>
  <path d="M56 80 H200 A28 28 0 0 1 228 108 V154 A28 28 0 0 1 200 182 H168 C144.8 182 152.8 156 128 156 C103.2 156 111.2 182 88 182 H56 A28 28 0 0 1 28 154 V108 A28 28 0 0 1 56 80 Z" fill="none" stroke="url(#rim)" stroke-width="2.5"/>

  <!-- Left lens -->
  <circle cx="80" cy="128" r="34" fill="url(#bezel)" stroke="#000" stroke-width="2"/>
  <circle cx="80" cy="128" r="29.5" fill="url(#glass)"/>
  <circle cx="80" cy="128" r="29.5" fill="url(#tint)"/>
  <g fill="none" stroke="#a8bed4" stroke-opacity=".07" stroke-width="1">
    <circle cx="80" cy="128" r="9"/><circle cx="80" cy="128" r="14"/><circle cx="80" cy="128" r="19"/><circle cx="80" cy="128" r="24"/>
  </g>
  <path d="M59.3 120.5 A22 22 0 0 1 70.7 108.1" fill="none" stroke="#fff" stroke-opacity=".42" stroke-width="4" stroke-linecap="round"/>
  <circle cx="76.9" cy="106.2" r="2.2" fill="#fff" opacity=".85"/>
  <!-- The atom's light, reflected -->
  <path d="M101.6 135.9 A23 23 0 0 1 91.5 147.9" fill="none" stroke="#4ef08c" stroke-opacity=".22" stroke-width="2" stroke-linecap="round"/>

  <!-- Right lens, with the atom inside -->
  <circle cx="176" cy="128" r="34" fill="url(#bezel)" stroke="#000" stroke-width="2"/>
  <circle cx="176" cy="128" r="29.5" fill="url(#glass)"/>
  <circle cx="176" cy="128" r="29.5" fill="url(#tint)"/>
  <g fill="none" stroke="#a8bed4" stroke-opacity=".07" stroke-width="1">
    <circle cx="176" cy="128" r="9"/><circle cx="176" cy="128" r="14"/><circle cx="176" cy="128" r="19"/><circle cx="176" cy="128" r="24"/>
  </g>
  <circle cx="176" cy="128" r="27" fill="url(#glow)"/>
  <g fill="none" stroke="url(#orbit)" stroke-width="3.2">
    <ellipse cx="176" cy="128" rx="23" ry="8.5" transform="rotate(-32 176 128)"/>
    <ellipse cx="176" cy="128" rx="23" ry="8.5" transform="rotate(32 176 128)"/>
  </g>
  <circle cx="193.7" cy="114.4" r="2.7" fill="#eafff3"/>
  <circle cx="158.3" cy="141.6" r="2.7" fill="#eafff3"/>
  <circle cx="176" cy="128" r="9" fill="url(#led)"/>
  <circle cx="176" cy="128" r="4.8" fill="url(#nucleus)"/>
  <path d="M155.3 120.5 A22 22 0 0 1 166.7 108.1" fill="none" stroke="#fff" stroke-opacity=".42" stroke-width="4" stroke-linecap="round"/>
  <circle cx="172.9" cy="106.2" r="2.2" fill="#fff" opacity=".85"/>
  </g>
</svg>
