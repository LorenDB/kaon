name: Build AppImage

on:
  push:

jobs:
  linux:
    name: AppImage-${{ matrix.arch }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-latest
            linuxdeploy-arch: x64
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
            linuxdeploy-arch: arm64

    steps:
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          cache: true

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install OpenXR headers
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-add-repository universe
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libopenxr-dev p7zip-full unzip

      - name: Build
        run: |
          mkdir appdir
          mkdir build
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_INSTALL_PREFIX=/usr .
          cmake --build build --config RelWithDebInfo -j $(nproc)

      - name: Install LinuxDeploy
        id: install-linuxdeploy
        uses: miurahr/install-linuxdeploy-action@v1.8.0
        with:
          plugins: qt appimage
          dir: ${{ github.workspace }}
          arch: ${{ matrix.linuxdeploy-arch }}

      - name: Install packages
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt install libfuse2t64 -y

      - name: Build release package
        run: |
          # remove problematic QSql drivers
          rm -f "$QT_ROOT_DIR/plugins/sqldrivers/libqsqlmimer.so"
          rm -f "$QT_ROOT_DIR/plugins/sqldrivers/libqsqloci.so"

          # Bundle unzip and 7za so the AppImage unpacks downloads on systems that don't have them installed.
          # Archive.cpp prefers these bundled copies over the host's PATH.
          # Ubuntu 24.04's /usr/bin/7* are shell wrappers (exec /usr/lib/7zip/*); linuxdeploy only
          # accepts ELF binaries, so find the real one. 7za is self-contained, unlike 7z which
          # needs 7z.so, and uses the same CLI. Older releases keep the real binary at /usr/bin/7za,
          # so try the known locations in order and take the first ELF.
          SEVEN_ZIP_BIN=""
          for cand in /usr/lib/7zip/7za /usr/lib/7zip/7zz /usr/bin/7za /usr/bin/7zz; do
            if [ -f "$cand" ] && [ "$(head -c 4 "$cand" | od -An -tx1 | tr -d ' \n')" = "7f454c46" ]; then
              SEVEN_ZIP_BIN="$cand"
              break
            fi
          done
          [ -n "$SEVEN_ZIP_BIN" ] || { echo "no 7zip ELF binary found"; exit 1; }
          QML_SOURCES_PATHS=src ${{ steps.install-linuxdeploy.outputs.linuxdeploy }} \
              --plugin qt \
              --output appimage \
              --desktop-file dev.lorendb.kaon.desktop \
              --icon-file src/qml/icons/kaon.svg \
              --executable build/src/kaon \
              --executable "$SEVEN_ZIP_BIN" \
              --executable /usr/bin/unzip \
              --appdir appdir

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: AppImage-${{ matrix.arch }}
          path: Kaon-${{ matrix.arch }}.AppImage
          retention-days: 90
